name: almena-registry

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_REGISTRY_WEB_URL: ${NEXT_PUBLIC_REGISTRY_WEB_URL:-https://registry.almena.id}
        NEXT_PUBLIC_REGISTRY_API_URL: ${NEXT_PUBLIC_REGISTRY_API_URL:-https://api.almena.id}
    image: almena-registry:dev
    restart: unless-stopped
    ports:
      - "${REGISTRY_WEB_PORT:-3000}:3000"
    volumes:
      - ./well-known:/app/well-known:ro
    environment:
      REGISTRY_API_URL: ${REGISTRY_API_URL:-https://api.almena.id}
      # /.well-known/did-configuration.json, from ./well-known.
      REGISTRY_WEB_WELL_KNOWN_DIR: /app/well-known
