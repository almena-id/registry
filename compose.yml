name: almena-registry-web

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_REGISTRY_API_URL: ${NEXT_PUBLIC_REGISTRY_API_URL:-http://localhost:8000}
    image: almena-registry-web:dev
    restart: unless-stopped
    ports:
      - "${REGISTRY_WEB_PORT:-3000}:3000"
    environment:
      # The API runs in its own Compose project (../registry-api): reach it
      # where it is published on the host.
      REGISTRY_API_URL: ${REGISTRY_API_URL_DOCKER:-http://host.docker.internal:8000}
    extra_hosts:
      # host.docker.internal on Linux too (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
